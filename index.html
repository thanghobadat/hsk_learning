<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HSK 3.0 Master - Lộ Trình Chinh Phục HSK 1 Đến HSK 3 Trong 8 Tháng</title>
    <meta name="description" content="Ứng dụng học tiếng Trung toàn diện theo chuẩn mới HSK 3.0: Lộ trình 8 tháng từ con số 0, Bảng phát âm Pinyin tương tác, Flashcard 3D, 50 bộ thủ, ngữ pháp và bài thi thử." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23e11d48%22/><text y=%2265%22 x=%2250%22 text-anchor=%22middle%22 font-family=%22serif%22 font-size=%2260%22 fill=%22white%22 font-weight=%22bold%22>汉</text></svg>">
  </head>
  <body>
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-container">
        <!-- Brand -->
        <div class="brand-wrapper" id="brandHome">
          <div class="brand-logo-seal">汉</div>
          <div class="brand-text">
            <h1>HSK 3.0 Master</h1>
            <span class="brand-badge">Chuẩn Mới 3.0</span>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="app-nav" aria-label="Điều hướng chính">
          <button class="nav-tab-btn active" data-tab="roadmap">
            <span>📅</span> Lộ Trình 8 Tháng
          </button>
          <button class="nav-tab-btn" data-tab="lessons">
            <span>📖</span> Bài Học HSK 3.0 (Cấp 1-3)
          </button>
          <button class="nav-tab-btn" data-tab="pinyin">
            <span>🔤</span> Bảng Pinyin
          </button>
          <button class="nav-tab-btn" data-tab="vocab">
            <span>📚</span> Từ Vựng HSK 3.0
          </button>
          <button class="nav-tab-btn" data-tab="flashcard">
            <span>🎴</span> Flashcard 3D
          </button>
          <button class="nav-tab-btn" data-tab="radicals">
            <span>✍️</span> Bộ Thủ & Tập Viết
          </button>
          <button class="nav-tab-btn" data-tab="grammar">
            <span>📖</span> Sổ Tay Ngữ Pháp
          </button>
          <button class="nav-tab-btn" data-tab="quiz">
            <span>🎮</span> Đấu Trường Quiz
          </button>
        </nav>

        <!-- Utility Buttons -->
        <div class="header-actions">
          <div class="streak-pill" title="Chuỗi ngày học liên tục của bạn">
            <span>🔥</span>
            <span>Chuỗi: <strong id="streakCounter">1</strong> ngày</span>
          </div>
          <button id="btnThemeToggle" class="btn-icon-header" title="Đổi chế độ Sáng / Tối">
            ☀️
          </button>
        </div>
      </div>
    </header>

    <!-- Main Viewport -->
    <main id="mainContent" class="app-main">
      <!-- Injected dynamically by main.js -->
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-container">
        <div class="footer-left">
          <strong>HSK 3.0 Master</strong> — Hệ thống học tiếng Trung tối ưu theo chuẩn Giáo Dục HSK 3.0 mới nhất.
        </div>
        <div class="footer-right">
          <span>🎯 Mục tiêu: HSK 1 - 3 trong 8 tháng (32 tuần)</span>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
